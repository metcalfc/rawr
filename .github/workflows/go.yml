name: Go apps

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          cache-dependency-path: go.sum
      - run: make test vet sdk-smoke build

  bundles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          cache-dependency-path: go.sum
      - name: Build distribution bundles
        env:
          RELEASE_VERSION: ci-${{ github.run_number }}
        run: go run ./scripts/release.go -version "$RELEASE_VERSION" -commit "$GITHUB_SHA"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: rawr-apps
          path: dist/*
          if-no-files-found: error
